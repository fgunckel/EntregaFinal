[project]
name = "ada-study"
version = "0.1.0"
description = "ADA Study — biblioteca documental con RAG incremental y centro de estudio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "pypdf>=4.0,<7.0",
    "langgraph>=0.2,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    # Checkpointer de conversaciones (CHECKPOINTER-01): AsyncPostgresSaver
    # usa psycopg3 (no asyncpg). Necesarios cuando
    # ADA_CONVERSATIONS_ENABLED=true (API en contenedor incluida).
    "langgraph-checkpoint-postgres>=3.2,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.6,<1.0",
    "httpx>=0.27,<1.0",
]
ui = [
    "streamlit>=1.40,<2.0",
    "httpx>=0.27,<1.0",
]
llm = [
    "langchain-openai>=1.7,<2.0",
]
observability = [
    # AGENT-TRACE-01 §6: instrumentación OpenInference de LangChain/LangGraph
    # con exportación OTLP hacia Phoenix (servicio en docker-compose, UI :6006).
    "openinference-instrumentation-langchain>=0.1.50,<2.0",
    "opentelemetry-sdk>=1.25,<3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requiere PostgreSQL real con el esquema aplicado (FIX-TC06); excluir con -m 'not integration'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ada_study"]
