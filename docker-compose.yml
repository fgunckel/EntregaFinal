# PostgreSQL 16 para ADA Study (ADR-0001: única fuente de estado).
# Uso: docker compose up -d
# La base se crea vacía; el esquema se aplica con:
#   python -m ada_study.db.create_schema "$DATABASE_URL"
services:
  postgres:
    image: postgres:16-alpine
    container_name: ada_study_postgres
    environment:
      POSTGRES_USER: ada
      POSTGRES_PASSWORD: ada_dev_password
      POSTGRES_DB: ada_study
    ports:
      - "5432:5432"
    volumes:
      - ada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ada -d ada_study"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phoenix (AGENT-TRACE-01 §6): UI de trazas técnicas en http://localhost:6006.
  # Opcional: levantar solo con `docker compose up -d phoenix`. La app exporta
  # spans vía OTLP hacia http://localhost:6006/v1/traces cuando
  # ADA_PHOENIX_ENABLED=true (endpoint: el que expone el colector de Phoenix).
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ada_study_phoenix
    ports:
      - "6006:6006"

volumes:
  ada_pgdata:

